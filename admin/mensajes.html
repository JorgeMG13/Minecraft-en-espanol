<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mensajes · Panel Minecraft en Español</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/css/admin.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="contenido">
      <div class="cabecera-pagina">
        <div>
          <h1>Mensajes</h1>
          <div class="sub">Mensajes enviados por los usuarios desde la web</div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;color:var(--a-muted);cursor:pointer;">
          <input type="checkbox" id="solo-no-leidos" style="accent-color:var(--a-green);" />
          Solo sin leer
        </label>
      </div>

      <div id="lista-mensajes"></div>
      <div id="zona-mas" class="centrado"></div>
    </main>
  </div>

  <script src="/assets/js/utils/dom.js"></script>
  <script src="/admin/config.js"></script>
  <script src="/admin/assets/js/services/api.js"></script>
  <script src="/admin/assets/js/components/ui.js"></script>
  <script src="/admin/assets/js/components/nav.js"></script>
  <script src="/admin/assets/js/utils/formato.js"></script>
  <script src="/admin/assets/js/pages/mensajes.js"></script>
</body>
</html>
