<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Noticias · Panel Minecraft en Español</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/assets/css/admin.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="contenido">
      <div class="cabecera-pagina">
        <div>
          <h1>Noticias</h1>
          <div class="sub">Gestiona lo publicado, los borradores y la búsqueda</div>
        </div>
        <a class="btn btn-primario" href="/admin/noticia.html">＋ Nueva noticia</a>
      </div>

      <div class="buscador-barra">
        <input type="search" id="buscar" placeholder="🔍 Buscar por título o slug…" autocomplete="off" />
        <select id="filtro-estado">
          <option value="todos">Todos los estados</option>
          <option value="publicada">Publicadas</option>
          <option value="borrador">Borradores</option>
          <option value="pendiente">Pendientes</option>
          <option value="programada">Programadas</option>
        </select>
      </div>

      <div id="lista-noticias"></div>
      <div id="zona-mas" class="centrado"></div>
    </main>
  </div>

  <script src="/assets/js/utils/dom.js"></script>
  <script src="/admin/config.js"></script>
  <script src="/admin/assets/js/services/api.js"></script>
  <script src="/admin/assets/js/components/ui.js"></script>
  <script src="/admin/assets/js/components/nav.js"></script>
  <script src="/admin/assets/js/utils/formato.js"></script>
  <script src="/admin/assets/js/pages/noticias.js"></script>
</body>
</html>
